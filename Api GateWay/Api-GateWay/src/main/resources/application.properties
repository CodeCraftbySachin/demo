spring.application.name=API-GATEWAY

server.port=8080


jwt.secret=ThisIsMyVerySecretKeyForHotelManagementProject
jwt.expiration=86400000


# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Discovery
spring.cloud.gateway.server.webmvc.discovery.locator.enabled=true
spring.cloud.gateway.server.webmvc.discovery.locator.lower-case-service-id=true

# AUTH SERVICE
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

# USER SERVICE
spring.cloud.gateway.server.webmvc.routes[1].id=user-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/users/**

# ROOM SERVICE
spring.cloud.gateway.server.webmvc.routes[2].id=room-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://ROOM-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/rooms/**

# BOOKING SERVICE
spring.cloud.gateway.server.webmvc.routes[3].id=booking-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/bookings/**